# RSPRecomp config for Mario Party 3's audio microcode (libultra n_aspMain, the n_audio variant;
# Mario Party 1 and 2 use plain aspMain). n_aspMain_code is at 0x800954C0 (ROM 0x960C0) and its
# data at 0x800A6050 (ROM 0xA6C50).
text_offset = 0x960C0
text_size = 0xE30
text_address = 0x04001080
rom_file_path = "mp3.us.z64"
output_file_path = "rsp/n_aspMain.cpp"
output_function_name = "n_aspMain"

# Audio command dispatch table (DMEM 0x00..0x1F of the ucode data). IMEM addresses wrap at 12 bits,
# so entry 14 (0x02B0) is 0x12B0. Commands 7 and 8 are unused (0x0000).
extra_indirect_branch_targets = [
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208,
    0x127C, 0x1348, 0x1248, 0x1C84, 0x12D4, 0x12B0, 0x1384
]
